<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hangnew's Wedding Invitation Builder</title>
    <style>
        /* basic layout */
        html, body { 
            margin:  0;
            padding: 0;
            width: 100%;
            height : 100vh;
        }

        body { 
            display: flex !important; /* !important to override default styles */
            flex-direction: row; /* horizontal layout */
            font-family : sans-serif; 
            overflow: hidden;}

        /* left panel : editor (30% width) */
        .editor-panel {
            flex : 0 0 350px; /* 30% width, no grow, no shrink */
            height : 100vh;
            padding : 20px; 
            background : #f8f9fa;
            border-right : 1px solid #ddd; 
            overflow-y: auto;
            box-sizing : border-box; /* ensure padding doesn't affect width */
        }

        /* right panel : mobile preview (70% width) */
        .preview-panel {
            flex: 1; 
            height : 100vh;
            background : #e9ecef;
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden;
        }

        /* mobile shape frame */
        .phone-frame {
            width: 360px; 
            height: 740px; /* typical mobile screen ratio */
            background : white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 30px; 
            overflow-y: auto;
            position: relative; 
            border: 12px solid #333; /* phone border */
        }

        /* insert form styles */
        .input-group { margin-bottom: 15px;}
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold;}
        .input-group input { width: 100%; padding: 8px; box-sizing: border-box;}

        /* text styles in preview */
        .wedding-card-content { text-align: center; padding-top: 60px;}
        .wedding-card-content p { font-size: 14px; color : #666; margin : 5px 0;}
        .wedding-card-content h1 { color : #8b5e3c; font-family: serif; margin : 20px 0;}
    </style>
</head>
<body>
    <!-- Left Panel: Editor -->
    <div class="editor-panel">
        <h2>청첩장 정보 입력</h2>
        <div class="input-group">
            <label>신랑 이름</label>
            <input type="text" id="groomName" placeholder="이름을 입력하세요" oninput="updateCard()">
        </div>
        <div class="input-group">
            <label>신부 이름</label>
            <input type="text" id="brideName" placeholder="이름을 입력하세요" oninput="updateCard()">
        </div>
        <div class="input-group">
            <label>결혼 날짜</label>
            <input type="date" id="weddingDate" oninput="updateCard()">
    </div>

    <!-- Right Panel: Mobile Preview -->
    <div class="preview-panel">
        <div class="phone-frame">
            <div class="wedding-card-content">
                <p>Wedding Invitation</p>
                <h1 id="previewNames">신랑 & 신부</h1>
                <p id="previewDate">2026.05.24</p>
                <div style="height : 200px; background : #eee; margin : 20px;">메인 이미지 영역</div>
                <p>저희의 시작을 축복해 주세요</p>
            </div>
        </div>
    </div>

    <script>
        // javascript
        function updateCard() {
            const groom = document.getElementById('groomName').value || '신랑';
            const bride = document.getElementById('brideName').value || '신부';
            const date = document.getElementById('weddingDate').value || '2026-05-24';

            document.getElementById('previewNames').innerText = `${groom} & ${bride}`;
            document.getElementById('previewDate').innerText = date;
        }
    </script>
</body>
</html>
