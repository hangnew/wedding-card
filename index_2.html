<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>윤이의 청첩장 빌더</title>
    <link rel="stylesheet" href="style_.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-wrapper">
      <!-- [왼쪽] 에디터 구역 -->
      <div class="editor-section">
        <h2 style="margin-top: 0; font-size: 20px">🛠 청첩장 빌더</h2>

        <!-- 탭 메뉴 -->
        <div style="display: flex; gap: 8px; margin-bottom: 20px">
          <button
            onclick="showTab('info')"
            id="btn-info"
            class="tab-btn"
            style="background: #b8860b; color: white"
          >
            기본정보
          </button>
          <button
            onclick="showTab('photo')"
            id="btn-photo"
            class="tab-btn"
            style="background: #ddd"
          >
            사진업로드
          </button>
          <button
            onclick="showTab('bank')"
            id="btn-bank"
            class="tab-btn"
            style="background: #ddd"
          >
            계좌 정보
          </button>
        </div>

        <!-- 탭 1: 정보 -->
        <div id="tab-info">
          <label>신랑 이름</label>
          <input
            type="text"
            id="g"
            oninput="run()"
            placeholder="이름을 입력하세요"
          />
          <label>신부 이름</label>
          <input
            type="text"
            id="b"
            oninput="run()"
            placeholder="이름을 입력하세요"
          />
          <label>예식 일자</label>
          <input type="date" id="d" oninput="run()" />
        </div>

        <!-- 탭 2: 사진 -->
        <div id="tab-photo" style="display: none">
          <label>메인 사진 업로드</label>
          <input
            type="file"
            id="photoInput"
            accept="image/*"
            onchange="previewImage()"
          />
        </div>

        <!-- 탭 3: 계좌 정보 -->
        <div id="tab-bank" style="display: none">
          <label>신랑측 계좌 번호</label>
          <input
            oninput="run()"
            id="groom-bank"
            type="text"
            placeholder="은행명 123-456-789"
          />
          <label>신부측 계좌 번호</label>
          <input
            oninput="run()"
            id="bride-bank"
            type="text"
            placeholder="은행명 987-654-321"
          />
        </div>
        <div style="padding-top: 20px; text-align: center">
          <button
            onclick="saveData()"
            class="tab-btn"
            style="background: #b8860b; color: white; width: 100%"
          >
            저장하기
          </button>
        </div>
      </div>

      <!-- [오른쪽] 프리뷰 구역 -->
      <div class="preview-section">
        <div class="phone">
          <div style="padding-top: 50px">
            <p style="letter-spacing: 3px; font-size: 12px">INVITATION</p>
            <h1 id="view" style="color: #b8860b; margin: 25px 0">
              신랑 & 신부
            </h1>

            <!-- 사진 영역 -->
            <div
              id="imgBox"
              style="
                width: 280px;
                height: 350px;
                background: #eee;
                margin: 0 auto;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 10px;
                overflow: hidden;
              "
            >
              <img
                id="mainPhoto"
                src=""
                style="
                  width: 100%;
                  height: 100%;
                  object-fit: cover;
                  display: none;
                "
              />
              <span id="msg">사진을 올려주세요</span>
            </div>

            <div class="accordion">
              <div class="acc-header" onclick="toggleAcc()">
                <span>💰 마음 전하실 곳</span>
                <span>▼</span>
              </div>
              <div id="accContent" class="acc-body">
                <b>신랑측 계좌 번호</b><br />
                <span id="viewBank">예금주 은행명 123-456-789</span><br /><br />
                <b>신부측 계좌 번호</b><br />
                <span id="viewBank2">예금주 은행명 987-654-321</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script_.js"></script>
  </body>
</html>
